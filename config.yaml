# MT5 Scalping Bot configuration
#
# Plug in your DEMO account credentials below, or leave login = 0 to attach
# to an MT5 terminal that is already running and logged in to your demo account.

account:
  login: 0              # demo account number (0 = use already-logged-in terminal)
  password: ""          # demo account password
  server: ""            # e.g. "MetaQuotes-Demo"
  terminal_path: ""     # optional: full path to terminal64.exe

# Total capital the bot is allowed to reason about. Even if the demo account
# has a larger balance, sizing and loss limits are computed against
# min(corpus, account equity) so behaviour matches a real 5k account.
corpus: 5000.0

risk:
  risk_per_trade_pct: 0.5      # 0.5% of corpus = $25 risked per trade
  max_daily_loss_pct: 2.0      # stop trading for the day at -2% ($100)
  max_daily_trades: 30         # hard cap on entries per day
  max_open_positions: 2        # across all symbols
  max_positions_per_symbol: 1
  max_spread_points: 20        # skip entries when spread is wider than this
  max_risk_overshoot: 1.5      # if even the min lot risks > 1.5x target, skip

# The bot trades EXACTLY the symbols listed here — it never picks its own.
# Use the names as they appear in your broker's Market Watch (gold may be
# "XAUUSD", "GOLD", or "XAUUSD.x" depending on the broker).
symbols:
  - EURUSD
  - GBPUSD

# Point-scaled settings above are tuned for 5-digit FX. Metals and indices
# have very different point sizes, so override them per symbol here (any
# strategy field plus max_spread_points can be overridden). These are sane
# starting values — check your broker's actual spreads and adjust.
symbol_overrides:
  XAUUSD:                    # gold: point = 0.01 -> 1 point = $0.01/oz
    max_spread_points: 45    # ~$0.45 spread allowance
    min_sl_points: 80        # never risk tighter than ~$0.80
    min_atr_points: 25
  XAGUSD:                    # silver: point = 0.001
    max_spread_points: 35
    min_sl_points: 60
    min_atr_points: 20
  US30:                      # Dow CFD: point = 0.1 index points (broker-dependent!)
    max_spread_points: 45    # ~4.5 index points
    min_sl_points: 150       # ~15 index points
    min_atr_points: 50

strategy:
  entry_timeframe: M1          # signal candles
  trend_timeframe: M5          # higher-timeframe trend filter
  ema_fast: 9
  ema_slow: 21
  trend_ema_fast: 20
  trend_ema_slow: 50
  rsi_period: 14
  rsi_long_min: 50.0           # long entries only while RSI is in [min, max]
  rsi_long_max: 70.0
  rsi_short_min: 30.0
  rsi_short_max: 50.0
  atr_period: 14
  min_atr_points: 15           # skip dead markets (ATR below this, in points)
  sl_atr_mult: 1.5             # stop-loss distance = 1.5 x ATR(M1)
  min_sl_points: 30            # floor so the stop is never inside spread noise
  reward_risk: 1.2             # take-profit = 1.2 x stop distance

management:
  breakeven_trigger_rr: 0.7    # at +0.7R move stop to entry...
  breakeven_buffer_points: 2   # ...plus a small buffer
  trail_atr_mult: 1.0          # after break-even, trail stop by 1 x ATR
  max_hold_minutes: 20         # scalps that go nowhere get closed

# Learn from losing trades. The bot journals every trade (journal/trades.csv)
# and blocks setups that persistently lose: bad hours, bad directions, wide
# spreads. It also halves risk after a losing streak until a winner resets it.
# Rules are recomputed over a rolling window, so blocks expire as losses age out.
learning:
  enabled: true
  journal_dir: journal
  lookback_days: 30            # only learn from the last N days of trades
  min_trades_per_bucket: 8     # need this many trades before judging a pattern
  block_expectancy_r: -0.15    # block a pattern averaging worse than -0.15R
  streak_throttle_after: 3     # halve risk after this many consecutive losses
  min_risk_multiplier: 0.25    # never cut risk below 25% of normal

session:
  # Only trade inside these UTC windows (London open + NY overlap by default).
  # Empty list = trade around the clock.
  trade_hours_utc:
    - "07:00-11:00"
    - "12:30-16:30"
  friday_flat_hour_utc: 20     # close everything and stop on Friday from this hour

bot:
  poll_seconds: 2
  magic: 510150                # identifies this bot's orders in MT5
  deviation_points: 10         # max slippage
  comment: "scalper-m1m5"
